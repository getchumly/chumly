[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chumly"
path = "src/main.rs"

[dependencies]
shared.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Render via OpenGL (glow): lighter than wgpu and no DirectX 12 requirement.
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts", "links", "wayland", "x11"] }
# Only to enable winit's default features that eframe would otherwise enable,
# e.g. window decorations on Wayland.
winit = "0.30.13"
# Bundled icon fonts (🎤 🔇 ⚙ etc.); without them icons render as boxes.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
cpal = "0.15"
opus = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
device_query = "2"
directories = "5"
sha2 = "0.10"
# Local time for chat timestamps and dates (chrono is unmaintained, RUSTSEC-2026-0543).
jiff = "0.2"
# The system's language for the first start (Windows API / LANG on Linux).
sys-locale = "0.3"
bytes = "1"
# Identity: key derivation (HKDF) and the self-signed client certificate.
ring = "0.17"
rcgen = "0.13"
# Self-update: the release signature (minisign) and swapping the running executable.
minisign-verify = "0.2"
self-replace = "1"
# H.264 for screen sharing: decoding on every platform, encoding where sharing works.
openh264 = "0.9.9"
# Downscaling captured frames (SIMD, single-threaded; see screen::scale_bgra).
fast_image_resize = { version = "6.2", features = ["only_u8x4"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[target."cfg(windows)".dependencies]
wasapi = "0.27.0"
windows-capture = "2.0.1"
# IsIconic: whether the shared window is minimized.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Downscaling and colour conversion of captured frames on the GPU (screen/capture/gpu.rs)
# and hardware H.264 encoding through Media Foundation (screen/encode/mf.rs).
# Same version as windows-capture uses, so its D3D11 device and textures fit.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_System_Threading", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[target."cfg(target_os = \"linux\")".dependencies]
# Screen capture under X11 (screen/capture/x11.rs): pure-Rust X protocol (already
# used by winit), shared memory frames, monitors, the pointer, covered windows.
x11rb = { version = "0.13", features = ["shm", "randr", "xfixes", "composite"] }
# System V shared memory for the X11 frames.
libc = "0.2"
# Screen capture under Wayland (screen/capture/portal.rs): the desktop portal's
# ScreenCast over D-Bus (0.13: same zbus 5 as accesskit), then a PipeWire stream.
ashpd = { version = "0.13.4", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
# Self-update: the Linux release is a .tar.gz with the executable inside.
flate2 = "1"
tar = "0.4"
