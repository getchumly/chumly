# cargo-about: collects the licenses of all dependencies into
# THIRD-PARTY-NOTICES.txt for release archives (.github/scripts/notices/generate.sh).
# Keep `accepted` in sync with [licenses] allow in deny.toml.
accepted = [
    "AGPL-3.0-only",          # Chumly itself (client, server, shared)
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# What we ship: the Windows and Linux builds.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
